<style>
    body {

    }
    a.animated-button:link, a.animated-button:visited {
        position: relative;
        display: block;
        margin: 30px auto 0;
        padding: 14px 15px;

        text-align: center;

        -moz-transition: all 1s ease;
        -o-transition: all 1s ease;
        transition: all 1s ease;
    }
    a.animated-button:link:after, a.animated-button:visited:after {
        content: "";
        position: absolute;
        height: 0%;
        left: 50%;
        top: 50%;
        width: 150%;
        z-index: -1;
        -webkit-transition: all 0.75s ease 0s;
        -moz-transition: all 0.75s ease 0s;
        -o-transition: all 0.75s ease 0s;
        transition: all 0.75s ease 0s;
    }
    a.animated-button:link:hover, a.animated-button:visited:hover {
        color: #FFF;
        text-shadow: none;
    }
    a.animated-button:link:hover:after, a.animated-button:visited:hover:after {
        height: 450%;
    }
    a.animated-button:link, a.animated-button:visited {
        position: relative;
        display: block;
        margin: 30px auto 0;
        padding: 14px 15px;
        color: #fff;
        font-size:20px;
        border-radius: 0;
        font-weight: bold;
        text-align: center;

        -webkit-transition: all 1s ease;
        -moz-transition: all 1s ease;
        -o-transition: all 1s ease;
        transition: all 1s ease;
    }
    a.animated-button.thar-four {
        color: #fff;
        cursor: pointer;
        display: block;
        position: relative;
        border: 2px solid #F7CA18;
        transition: all 0.4s cubic-bezier(0.42, 0, 0.58, 1);
    }
    a.animated-button.thar-four:hover {
        color: #000 !important;
        background-color: transparent;
        text-shadow: nfour;
    }
    a.animated-button.thar-four:hover:before {
        right: 0%;
        left: auto;
        width: 100%;
    }
    a.animated-button.thar-four:before {
        display: block;
        position: absolute;
        top: 0px;
        left: 0px;
        height: 100%;
        width: 0px;
        z-index: -1;
        content: '';
        color: #000 !important;
        background: #F7CA18;
        transition: all 0.4s cubic-bezier(0.42, 0, 0.58, 1);
    }

<script>
    function set(num, name){
        if (confirm("Are you sure to set '"+name+"'?")){
            xhr = new XMLHttpRequest();
            xhr.open("GET", "/set?"+num,true);
            xhr.send();

            if (confirm("You need to reboot for changes. Do you want to reboot?"))
                reboot();
        }
    }

    function reboot(){
        code = btoa(Date.now()/1000);
        xhr = new XMLHttpRequest();
        xhr.open("GET", "/reboot?"+code,true);
        xhr.send();
    }

</script>
