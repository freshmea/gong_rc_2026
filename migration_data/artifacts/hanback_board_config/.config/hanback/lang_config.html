<html>
	<head>
		<title>Language Setting</title>
	</head>
	<body>
        <style>
            body {
                font-family: 'Lato', sans-serif;
                background: #8c8ec6;
                color: #FFF;
            }
            a.animated-button:link, a.animated-button:visited {
                position: relative;
                display: block;
                margin: 30px auto 0;
                padding: 14px 15px;
                color: #fff;
                font-size:20px;
                font-weight: bold;
                text-align: center;
                text-decoration: none;
                overflow: hidden;
                letter-spacing: .08em;
                border-radius: 0;
                text-shadow: 0 0 1px rgba(0, 0, 0, 0.2), 0 1px 0 rgba(0, 0, 0, 0.2);
                -webkit-transition: all 1s ease;
                -moz-transition: all 1s ease;
                -o-transition: all 1s ease;
                transition: all 1s ease;
            }
            a.animated-button:link:after, a.animated-button:visited:after {
                content: "";
                position: absolute;
                height: 0%;
                left: 50%;
                top: 50%;
                width: 150%;
                z-index: -1;
                -webkit-transition: all 0.75s ease 0s;
                -moz-transition: all 0.75s ease 0s;
                -o-transition: all 0.75s ease 0s;
                transition: all 0.75s ease 0s;
            }
            a.animated-button:link:hover, a.animated-button:visited:hover {
                color: #FFF;
                text-shadow: none;
            }
            a.animated-button:link:hover:after, a.animated-button:visited:hover:after {
                height: 450%;
            }
            a.animated-button:link, a.animated-button:visited {
                position: relative;
                display: block;
                margin: 30px auto 0;
                padding: 14px 15px;
                color: #fff;
                font-size:20px;
                border-radius: 0;
                font-weight: bold;
                text-align: center;
                text-decoration: none;
                overflow: hidden;
                letter-spacing: .08em;
                text-shadow: 0 0 1px rgba(0, 0, 0, 0.2), 0 1px 0 rgba(0, 0, 0, 0.2);
                -webkit-transition: all 1s ease;
                -moz-transition: all 1s ease;
                -o-transition: all 1s ease;
                transition: all 1s ease;
            }
            a.animated-button.thar-four {
                color: #fff;
                cursor: pointer;
                display: block;
                position: relative;
                border: 2px solid #F7CA18;
                transition: all 0.4s cubic-bezier(0.42, 0, 0.58, 1);
            }
            a.animated-button.thar-four:hover {
                color: #000 !important;
                background-color: transparent;
                text-shadow: nfour;
            }
            a.animated-button.thar-four:hover:before {
                right: 0%;
                left: auto;
                width: 100%;
            }
            a.animated-button.thar-four:before {
                display: block;
                position: absolute;
                top: 0px;
                left: 0px;
                height: 100%;
                width: 0px;
                z-index: -1;
                content: '';
                color: #000 !important;
                background: #F7CA18;
                transition: all 0.4s cubic-bezier(0.42, 0, 0.58, 1);
            }
        
            @media only screen and (max-width: 720px){
                .panel  {
                    width: 45%;
                    display: inline-block;
                }
        
                a.animated-button:link, a.animated-button:visited {
                    font-size:14px;
                }
            }
        
            @media only screen and (min-width: 721px){
                .panel {
                    width: 30%;
                    display: inline-block;
                }
        
                a.animated-button:link, a.animated-button:visited {
                    font-size:20px;
                }
            }
        
            .image{
                width: 50%;
                margin:20px;
                cursor: pointer;
                opacity:1;
                
                -webkit-transition: opacity 0.3s ease;
                -moz-transition: opacity 0.3s ease;
                -o-transition: opacity 0.3s ease;
                transition: opacity 0.3s ease;
            }
        
            .image:hover{
                opacity:0.5;
                
            }
        
            .button{
                min-width: 200px;
                margin:20px
            }
        
            .title{
                margin-top: 1em;
                margin-bottom: 1em;
            }
        
            .column{
                margin-bottom: 3em;
            }
        </style>
<div><a href="/"><img src="/images/back.png" style="
    width: 5em;
    position: fixed;
    cursor: pointer;
    "></a></div>
<center><h1 class="title">Language Setting</h1>
    <div class="panel">
        <center>
            <div class="image_box" onclick="set_lang(0);">
                <img class="image" src="images/korea.png">
            </div>
        </center>
        <div class="button col-md-3 col-sm-3 col-xs-6" onclick="set_lang(0);"> 
            <a href="#" class="btn btn-sm animated-button thar-four">
                Korean
            </a> 
        </div>
    </div>
    <div class="panel">
        <center>
            <div class="image_box" onclick="set_lang(1);">
                <img class="image" src="images/english.png">
            </div>
        </center>
        <div class="button col-md-3 col-sm-3 col-xs-6" onclick="set_lang(1);"> 
            <a href="#" class="btn btn-sm animated-button thar-four">
                English
            </a> 
        </div>
    </div>
</center>
	</body>
</html>

<script>
    function set_lang(n){
        let xhr = new XMLHttpRequest();
        xhr.open("GET", "/set_lang?"+n,true);
        xhr.send();

        if (confirm("You need to reboot for changes. Do you want to reboot?"))
            reboot();
    }

    function reboot(){
        code = btoa(Date.now()/1000);
        xhr = new XMLHttpRequest();
        xhr.open("GET", "/reboot?"+code,true);
        xhr.send();
    }
</script>
